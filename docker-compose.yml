services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trialdiff
      POSTGRES_PASSWORD: trialdiff
      POSTGRES_DB: trialdiff
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialdiff -d trialdiff"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - trialdiff-pgdata:/var/lib/postgresql/data

volumes:
  trialdiff-pgdata:
