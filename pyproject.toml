[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trialdiff"
version = "0.1.0"
description = "ClinicalTrials.gov study-record history harvester, materiality classifier, and Evidence Record generator/verifier."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trialdiff = "trialdiff.cli:main"

[tool.setuptools]
packages = ["trialdiff", "trialdiff.classifier", "trialdiff.fetchers"]

[tool.setuptools.package-data]
trialdiff = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
