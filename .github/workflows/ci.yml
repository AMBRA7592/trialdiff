name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }} — tests, validators, manifests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trialdiff
          POSTGRES_PASSWORD: trialdiff
          POSTGRES_DB: trialdiff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trialdiff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras) and jsonschema
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" jsonschema

      - name: Unit tests
        run: pytest -q

      - name: Frozen-package validators (recompute hashes)
        run: |
          python scripts/validate_alpha_demo.py
          python scripts/validate_event_class_package.py --package event_class_records_v0.1.1
          python scripts/validate_event_class_package.py --package event_class_records_v0.1.2

      - name: JSON Schema validation of all committed records
        run: python scripts/validate_schemas.py

      - name: Manifest integrity
        run: |
          sha256sum -c --quiet MANIFEST.sha256
          sha256sum -c --quiet MANIFEST.calibration.sha256
          (cd event_class_records_v0.1.1 && sha256sum -c --quiet MANIFEST.sha256)
          (cd event_class_records_v0.1.2 && sha256sum -c --quiet MANIFEST.sha256)
          # v0.1 is a stub: its record entries must still verify against the
          # byte-identical v0.1.1 copies (this proves the stub's claim).
          (cd event_class_records_v0.1 && sed 's#  records/#  ../event_class_records_v0.1.1/records/#' MANIFEST.sha256 | sha256sum -c --quiet)

      - name: Offline record verification (trialdiff verify)
        # shell: bash makes GitHub add pipefail, so the verifier's exit code
        # survives the pipe; without it this gate could never fail.
        shell: bash
        run: trialdiff verify records event_class_records_v0.1.1/records event_class_records_v0.1.2/records | tail -1

      - name: Seed-from-records smoke test
        run: |
          python scripts/seed_from_records.py --db /tmp/seed_ci.sqlite3
          python scripts/sqlite_to_postgres.py /tmp/seed_ci.sqlite3 \
            --truncate --package-generation v0.1.2 --activate-generation \
            --output /tmp/seed_ci.sql
          test -s /tmp/seed_ci.sql

      - name: Postgres round-trip — canonical bytes survive import
        env:
          PGPASSWORD: trialdiff
        run: |
          for f in postgres/migrations/*.sql; do
            psql -h localhost -U trialdiff -d trialdiff -q -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U trialdiff -d trialdiff -q -v ON_ERROR_STOP=1 -f /tmp/seed_ci.sql
          mismatches=$(psql -h localhost -U trialdiff -d trialdiff -tA -c \
            "SELECT count(*) FROM evidence_records WHERE encode(sha256(convert_to(canonical_json,'UTF8')),'hex') <> canonical_hash;")
          echo "canonical hash mismatches after import: $mismatches"
          test "$mismatches" = "0"
          state=$(psql -h localhost -U trialdiff -d trialdiff -tA -F '|' -c \
            "SELECT (SELECT count(*) FROM evidence_record_store), \
                    (SELECT count(*) FROM evidence_records), \
                    (SELECT package_generation FROM evidence_record_generations WHERE is_active);")
          test "$state" = "97|97|v0.1.2"

  frontend:
    name: Frontend — build + two-generation HTTP contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trialdiff
          POSTGRES_PASSWORD: trialdiff
          POSTGRES_DB: trialdiff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trialdiff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trialdiff:trialdiff@localhost:5432/trialdiff?sslmode=disable
      PGPASSWORD: trialdiff
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package for fixture and offline verification
        working-directory: .
        run: pip install -e .

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type/diagnostics check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Build matched frozen-generation fixtures
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p /tmp/v011-common /tmp/v012-common
          count=0
          for successor in event_class_records_v0.1.2/records/evt_*.json; do
            name=$(basename "$successor")
            prefix=${name%_*}
            matches=(event_class_records_v0.1.1/records/${prefix}_*.json)
            if test ${#matches[@]} -eq 1; then
              ln -s "$GITHUB_WORKSPACE/${matches[0]}" "/tmp/v011-common/$(basename "${matches[0]}")"
              ln -s "$GITHUB_WORKSPACE/$successor" "/tmp/v012-common/$name"
              count=$((count + 1))
            fi
          done
          test "$count" = "95"
          python scripts/seed_from_records.py --db /tmp/v011.sqlite3 --source /tmp/v011-common
          python scripts/seed_from_records.py --db /tmp/v012.sqlite3 --source /tmp/v012-common
          python scripts/sqlite_to_postgres.py /tmp/v011.sqlite3 \
            --truncate --package-generation v0.1.1 --activate-generation \
            --output /tmp/v011.sql
          python scripts/sqlite_to_postgres.py /tmp/v012.sqlite3 \
            --evidence-only --package-generation v0.1.2 --supersedes v0.1.1 \
            --output /tmp/v012.sql

      - name: Rehearse additive import and explicit activation
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          for migration in postgres/migrations/*.sql; do
            psql -h localhost -U trialdiff -d trialdiff -q -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U trialdiff -d trialdiff -q -v ON_ERROR_STOP=1 -f /tmp/v011.sql
          psql -h localhost -U trialdiff -d trialdiff -q -v ON_ERROR_STOP=1 -f /tmp/v012.sql

          staged=$(psql -h localhost -U trialdiff -d trialdiff -tA -F '|' -c \
            "SELECT (SELECT count(*) FROM evidence_record_store), \
                    (SELECT count(*) FROM evidence_records), \
                    (SELECT string_agg(package_generation || ':' || is_active::text, ',' ORDER BY package_generation) FROM evidence_record_generations), \
                    (SELECT count(*) FROM evidence_record_supersessions);")
          test "$staged" = "190|95|v0.1.1:true,v0.1.2:false|95"

          psql -h localhost -U trialdiff -d trialdiff -q -v ON_ERROR_STOP=1 \
            -c "SELECT trialdiff_activate_evidence_generation('v0.1.2');"
          active=$(psql -h localhost -U trialdiff -d trialdiff -tA -F '|' -c \
            "SELECT (SELECT count(*) FROM evidence_record_store), \
                    (SELECT count(*) FROM evidence_records), \
                    (SELECT string_agg(package_generation || ':' || is_active::text, ',' ORDER BY package_generation) FROM evidence_record_generations), \
                    (SELECT count(*) FROM evidence_record_supersessions), \
                    (SELECT count(*) FROM evidence_record_store WHERE encode(sha256(convert_to(canonical_json,'UTF8')),'hex') <> canonical_hash);")
          test "$active" = "190|95|v0.1.1:false,v0.1.2:true|95|0"
          psql -h localhost -U trialdiff -d trialdiff -tA -F ' ' -c \
            "SELECT superseded_event_id, successor_event_id FROM evidence_record_supersessions ORDER BY superseded_event_id LIMIT 1" \
            > /tmp/coexistence-ids.txt

      - name: Start frontend against coexistence database
        run: |
          nohup npm run dev -- --port 4321 > /tmp/trialdiff-frontend.log 2>&1 &
          echo $! > /tmp/trialdiff-frontend.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/trialdiff-frontend.log
          exit 1

      - name: Verify immutable old/new HTTP responses and discovery index
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          read -r old_id new_id < /tmp/coexistence-ids.txt
          old_file=$(find /tmp/v011-common -name "$old_id.json" -print -quit)
          new_file=$(find /tmp/v012-common -name "$new_id.json" -print -quit)
          old_body="/tmp/$old_id.json"
          new_body="/tmp/$new_id.json"
          test -n "$old_file"
          test -n "$new_file"

          curl -fsS -D /tmp/old.headers "http://127.0.0.1:4321/events/$old_id.json" -o "$old_body"
          curl -fsS -D /tmp/new.headers "http://127.0.0.1:4321/events/$new_id.json" -o "$new_body"
          cmp "$old_file" "$old_body"
          cmp "$new_file" "$new_body"
          trialdiff verify "$old_body" "$new_body"
          grep -qi '^x-trialdiff-record-status: superseded' /tmp/old.headers
          grep -qi "^x-trialdiff-successor-event-id: $new_id" /tmp/old.headers
          grep -qi '^cache-control: public, max-age=31536000, immutable' /tmp/old.headers
          grep -qi '^x-trialdiff-record-status: current' /tmp/new.headers
          grep -qi "^x-trialdiff-predecessor-event-id: $old_id" /tmp/new.headers

          curl -fsS "http://127.0.0.1:4321/events/$old_id" -o /tmp/old.html
          grep -F 'Superseded Evidence Record' /tmp/old.html
          grep -F "$new_id" /tmp/old.html

          curl -fsS -D /tmp/index.headers http://127.0.0.1:4321/events/supersessions.json -o /tmp/index.json
          grep -qi '^cache-control: public, max-age=0, must-revalidate' /tmp/index.headers
          ! grep -qi 'immutable' /tmp/index.headers
          grep -F "\"event_id\":\"$old_id\"" /tmp/index.json
          grep -F "\"successor_event_id\":\"$new_id\"" /tmp/index.json

          etag=$(awk 'BEGIN{IGNORECASE=1} /^etag:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' /tmp/old.headers)
          : > /tmp/old-304.body
          curl -sS -D /tmp/old-304.headers -H "If-None-Match: $etag" \
            "http://127.0.0.1:4321/events/$old_id.json" -o /tmp/old-304.body
          grep -q ' 304 ' /tmp/old-304.headers
          test ! -s /tmp/old-304.body

          test "$(curl -sS -o /tmp/unknown.json -w '%{http_code}' http://127.0.0.1:4321/events/evt_UNKNOWN_v1_v2_deadbeef0000.json)" = "404"
          test "$(curl -sS -o /tmp/unknown.html -w '%{http_code}' http://127.0.0.1:4321/events/evt_UNKNOWN_v1_v2_deadbeef0000)" = "404"
